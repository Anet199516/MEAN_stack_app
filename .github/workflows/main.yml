name: CI/CD Pipeline with Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Jobs it's a set of actions that will be executed
jobs:
  build-and-push:
    # We could use 3 dif jobs that will run for 3 different operations systems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # checkout repo - @v4 it's a veriosn
        uses: actions/checkout@v4
        # Fetch full history for Git SHA
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate a unique tag using the short Git commit SHA
      - name: Generate image tag
        id: generate_tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- BACKEND BUILD & PUSH ---

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile # Refers to your backend Dockerfile
          push: true
          tags: |
            hannafoxy111/afs_backend:${{ steps.generate_tag.outputs.TAG }}
            hannafoxy111/afs_backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- FRONTEND BUILD & PUSH ---

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend # Refers to your frontend Dockerfile
          push: true
          tags: |
            hannafoxy111/afs_frontend:${{ steps.generate_tag.outputs.TAG }}
            hannafoxy111/afs_frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- DEPLOYMENT STEP ---
  deploy:
      # This job runs only after 'build-and-push' completes successfully
      needs: [ build-and-push ]
      # We run this job only on 'push' events to the 'main' branch, not pull requests
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      steps:
        - name: Trigger Render Backend Deployment
          uses: johnbeynon/render-deploy-action@v0.0.8
          with:
            service-id: ${{ secrets.RENDER_BACKEND_SERVICE_ID }}
            api-key: ${{ secrets.RENDER_API_KEY }}
            # The action forces Render to re-pull the 'latest' tag you just updated
            wait-for-success: true

        - name: Trigger Render Frontend Deployment
          uses: johnbeynon/render-deploy-action@v0.0.8
          with:
            service-id: ${{ secrets.RENDER_FRONTEND_SERVICE_ID }}
            api-key: ${{ secrets.RENDER_API_KEY }}
            wait-for-success: true
