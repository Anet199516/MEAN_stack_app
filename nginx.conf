server {
    listen 80;
    root /usr/share/nginx/html;

    # Завжди віддаємо index.html без кешування, щоб забезпечити завантаження нової версії SPA
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri /index.html =404;
    }

    # Кешування статичних файлів (JS, CSS, зображення) на 1 рік (immutable assets)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Для решти файлів (наприклад, маршрутизації SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
